version: 2

models:
  - name: stg_tpch__customer
    description: "Staging view for TPC-H customers"
    columns:
      - name: customer_id
        description: "Primary key for customer"
        tests:
          - not_null
          - unique
      - name: nation_id
        tests:
          - not_null

  - name: stg_tpch__orders
    description: "Staging view for TPC-H orders"
    columns:
      - name: order_id
        description: "Primary key for order"
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null

  - name: stg_tpch__lineitem
    description: "Staging view for TPC-H order line items"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: line_number
        tests:
          - not_null
      - name: part_id
        tests:
          - not_null
      - name: supplier_id
        tests:
          - not_null

  - name: stg_tpch__part
    description: "Staging view for TPC-H parts"
    columns:
      - name: part_id
        description: "Primary key for part"
        tests:
          - not_null
          - unique

  - name: stg_tpch__partsupp
    description: "Staging view for TPC-H part supplier relationships"
    columns:
      - name: part_id
        tests:
          - not_null
      - name: supplier_id
        tests:
          - not_null

  - name: stg_tpch__supplier
    description: "Staging view for TPC-H suppliers"
    columns:
      - name: supplier_id
        description: "Primary key for supplier"
        tests:
          - not_null
          - unique
      - name: nation_id
        tests:
          - not_null

  - name: stg_tpch__nation
    description: "Staging view for TPC-H nations"
    columns:
      - name: nation_id
        description: "Primary key for nation"
        tests:
          - not_null
          - unique
      - name: region_id
        tests:
          - not_null

  - name: stg_tpch__region
    description: "Staging view for TPC-H regions"
    columns:
      - name: region_id
        description: "Primary key for region"
        tests:
          - not_null
          - unique
