version: 2

models:
  - name: dim_users
    description: "Conformed user dimension with surrogate key"
    columns:
      - name: user_sk
        description: "Surrogate key for the user dimension"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Natural user ID"
        tests:
          - unique
          - not_null

  - name: fct_events
    description: "Fact table for ingested event occurrences"
    columns:
      - name: event_sk
        description: "Surrogate primary key for the event fact"
        tests:
          - unique
          - not_null
      - name: event_id
        description: "Natural event ID"
        tests:
          - not_null
      - name: user_sk
        description: "Foreign key referencing dim_users"
        tests:
          - not_null

